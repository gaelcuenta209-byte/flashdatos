name: Medios para publicar

# Claude sube a la rama "medios" una carpeta NN/ con el MP4 final y la portada.
# Esta acción los publica como release "video-NN" para que Metricool tenga un enlace público:
#   https://github.com/<dueño>/<repo>/releases/download/video-NN/<archivo>
# Después deja la rama "medios" vacía para que el repositorio no crezca con cada video.
on:
  push:
    branches: [medios]

permissions:
  contents: write

concurrency:
  group: medios
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: medios
      - name: Crear o actualizar los releases
        run: |
          shopt -s nullglob
          : > enlaces.txt
          for d in */; do
            n="${d%/}"
            files=("$n"/*.mp4 "$n"/*.jpg "$n"/*.png)
            [ ${#files[@]} -eq 0 ] && continue
            tag="video-$n"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "${files[@]}" --clobber
            else
              gh release create "$tag" "${files[@]}" --target main --title "Video $n" --notes "Archivos del video $n de Flash Datos, listos para publicar."
            fi
            for f in "${files[@]}"; do
              url="https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/$(basename "$f")"
              code=$(curl -sIL -o /dev/null -w '%{http_code} %{content_type} %{size_download}' "$url")
              echo "$url $code" | tee -a enlaces.txt
            done
          done
      - name: Vaciar la rama medios
        run: |
          git config user.name "flashdatos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan vacia
          git rm -rq --cached . || true
          printf "Rama temporal: aquí Claude sube el video del día y la acción lo convierte en release.\n" > LEEME.md
          git add LEEME.md
          git commit -qm "Medios publicados como release"
          git push -f origin vacia:medios
