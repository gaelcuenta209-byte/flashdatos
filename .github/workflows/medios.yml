name: Medios para publicar

# 1. Claude sube a la rama "medios" una carpeta NN/ con el MP4 final y la portada.
# 2. Después sube a main videos/NN-tema/medios.json: {"numero": "NN", "archivos": ["FlashDatos_NN.mp4", "FlashDatos_NN_portada.jpg"]}
# 3. Esta acción publica esos archivos como release "video-NN", para que Metricool tenga un enlace público:
#      https://github.com/<dueño>/<repo>/releases/download/video-NN/<archivo>
#    Escribe videos/NN-tema/medios_estado.json con los enlaces y deja la rama "medios" vacía.
on:
  push:
    branches: [main]
    paths: ["videos/*/medios.json"]

permissions:
  contents: write

concurrency:
  group: medios
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: medios
          path: _medios
      - name: Crear o actualizar los releases
        run: python3 .github/scripts/medios.py
      - name: Guardar los enlaces en main
        run: |
          git config user.name "flashdatos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos/*/medios_estado.json
          if ! git diff --cached --quiet; then
            git commit -qm "Medios publicados"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          fi
      - name: Vaciar la rama medios
        working-directory: _medios
        run: |
          git config user.name "flashdatos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan vacia
          git rm -rq --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          printf "Rama temporal: aquí Claude sube el video del día y la acción medios.yml lo convierte en release.\n" > LEEME.md
          git add LEEME.md
          git commit -qm "Rama medios vacía"
          git push -f origin vacia:medios
